[package]
name = "ugrammar"
version = "0.1.4"
edition = "2021"
authors = ["Tín Nguyễn"]
description = "Menu-bar grammar fixer for macOS"
repository = "https://github.com/tinwritescode/ugrammar"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-nspanel = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2.14.2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }
ugrammar-core = { path = "../core" }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "NSScreen"] }
objc2-foundation = "0.3.2"
objc2 = "0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
