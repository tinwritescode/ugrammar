[package]
name = "ugrammar-core"
version = "0.1.0"
edition = "2021"
authors = ["Tín Nguyễn"]
description = "Platform-free core of ugrammar: settings, engine client, diff, sentence logic"
repository = "https://github.com/tinwritescode/ugrammar"
publish = false

[dependencies]
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["time", "macros", "rt"] }
