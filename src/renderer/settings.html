<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<title>ugrammar Settings</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="settings.css"></head>
<body>
<h1>ugrammar</h1>
<section id="perm" hidden><strong>Accessibility permission needed.</strong>
  <button id="openAX">Open System Settings</button></section>

<section><h2>Engine</h2>
  <label>Endpoint (OpenAI-compatible)<input id="endpoint" spellcheck="false"></label>
  <label>Model<input id="model" spellcheck="false"></label>
  <label>API key <span class="mut" id="keyState"></span><input id="apiKey" type="password" placeholder="Leave empty if not required" autocomplete="off"></label>
  <div class="row"><button id="test">Test connection</button><span id="testResult"></span></div>
</section>

<section><h2>Hotkey</h2>
  <div class="row" id="mods"></div>
  <label>Key<select id="hkKey"></select></label>
</section>

<section><h2>Dictionary</h2>
  <p class="mut">Words the AI must not change.</p>
  <div class="row"><input id="newWord" placeholder="Add word"><button id="addWord">Add</button></div>
  <ul id="words"></ul>
</section>

<section><h2>Excluded apps</h2>
  <p class="mut">Text in these apps is never read or sent. Bundle IDs.</p>
  <div class="row"><input id="newApp" placeholder="com.example.app"><button id="addApp">Add</button><button id="pickApp">Choose app…</button></div>
  <ul id="apps"></ul>
</section>

<div class="row foot"><button class="primary" id="save">Save</button><span id="saved"></span></div>
<script src="settings.js"></script>
</body></html>
